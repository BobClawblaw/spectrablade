# Builds the Windows packages (the portable zip and the installer) and keeps them as an artifact.
# When a release is published, it builds that release's tag and attaches the packages and their
# SHA-256 files to it, beside the Mac disk image, so every release ships both. Running it by hand
# with a tag does the same for a release already out.
# The tests aren't run here: they need an audio device and a desktop, which these runners don't
# have. Run them on a Windows machine with Scripts/package-windows.ps1 (see docs/TESTING.md).
name: Windows

on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the Windows packages to (blank builds the branch only)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build and package
        shell: pwsh
        run: ./Scripts/package-windows.ps1 -Jobs 4 -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: SpectraBlade-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: env.RELEASE_TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $files = @(
            "dist/SpectraBlade-$version-windows-x64-setup.exe",
            "dist/SpectraBlade-$version-windows-x64-setup.exe.sha256",
            "dist/SpectraBlade-$version-windows-x64.zip",
            "dist/SpectraBlade-$version-windows-x64.zip.sha256"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "$f is missing: does CMakeLists.txt's version match $env:RELEASE_TAG?" }
          }
          gh release upload $env:RELEASE_TAG @files --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
